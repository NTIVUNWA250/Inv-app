name: inventory_mobile
description: Inventory app — track stock, check-outs, and who took what.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  flutter_secure_storage: ^9.2.0
  flutter_dotenv: ^5.1.0
  go_router: ^14.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
